name: Issue Triage

on:
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: "issue-triage"
  max-parallel: 1

jobs:
  triage:
    if: |
      github.event.issue.state == 'open' &&
      github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
      issues: write
    steps:
      - name: Check account age & triage status
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const repo = context.repo;

            // 1. Check account age (30 days threshold)
            const user = await github.rest.users.getByUsername({
              username: issue.user.login
            });
            const created = new Date(user.data.created_at);
            const days = (Date.now() - created) / (1000 * 60 * 60 * 24);
            const trusted = days >= 30;

            // 2. Check if already triaged (has any triage label)
            const triageLabels = [
              'needs-triage', 'needs-info', 'ready-for-agent',
              'ready-for-human', 'wontfix'
            ];
            const alreadyTriaged = issue.labels.some(l =>
              triageLabels.includes(l.name)
            );

            // 3. Check for existing agent brief in comments
            const comments = await github.rest.issues.listComments({
              issue_number: issue.number,
              owner: repo.owner,
              repo: repo.repo
            });
            const hasAgentBrief = comments.data.some(c =>
              c.body.includes('## Agent Brief') ||
              c.body.includes('This was generated by AI during triage')
            );

            const shouldTriage = trusted && !alreadyTriaged && !hasAgentBrief;

            core.setOutput('should_triage', String(shouldTriage));
            if (!trusted) core.setOutput('reason', 'account_too_new');
            else if (alreadyTriaged) core.setOutput('reason', 'already_triaged');
            else if (hasAgentBrief) core.setOutput('reason', 'brief_exists');

      - name: Checkout repository
        if: steps.check.outputs.should_triage == 'true'
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3 (pinned SHA)
        with:
          persist-credentials: false

      - name: Run OpenCode Triage
        if: steps.check.outputs.should_triage == 'true'
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          prompt: |
            Вы — AI-ассистент для автотриажa issue в этом репозитории.

            Прочитайте issue полностью (тело, комментарии, лейблы, автор).
            Используйте скилл triage для категоризации.

            Правила:
            - Если issue уже имеет лейбл needs-triage, needs-info, ready-for-agent, ready-for-human или wontfix — НЕ меняйте ничего, просто напишите "Issue already triaged."
            - Если в комментариях уже есть "## Agent Brief" — НЕ создавайте новый brief, просто напишите "Agent brief already exists."
            - Иначе: проведите полный triage:
              1. Категоризируйте: bug или enhancement
              2. Определите состояние: needs-triage → needs-info / ready-for-agent / ready-for-human / wontfix
              3. Проверьте claim: есть ли reproduce steps для багов, подтверждение для фич
              4. Примените соответствующие лейблы (ровно один category + один state)
              5. Если ready-for-agent — напишите Agent Brief в формате из AGENT-BRIEF.md
              6. Если needs-info — напишите needs-info template
              7. Если wontfix — объясните причину и закройте issue

            Важно: используйте лейблы из docs/agents/triage-labels.md для соответствия.
            Все комментарии начинайте с: > *This was generated by AI during triage.*
